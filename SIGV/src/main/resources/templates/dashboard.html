<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GesCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css(v=${#dates.createNow().getTime()})}" rel="stylesheet">
    <style>
        .stat-icon.red { background: rgba(239,68,68,0.1); color: #EF4444; }
    </style>
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="bi bi-box-seam-fill"></i></div>
                <div>
                    <h5>GesCom</h5>
                    <small>Gestion Comercial</small>
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="menu-label">Menu Principal</div>
                <a class="nav-item active">
                    <span class="icon"><i class="bi bi-grid"></i></span>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/productos}" class="nav-item">
                    <span class="icon"><i class="bi bi-box"></i></span>
                    <span>Productos</span>
                </a>
                <a th:href="@{/admin/pedidos}" class="nav-item">
                    <span class="icon"><i class="bi bi-cart"></i></span>
                    <span>Pedidos</span>
                </a>
                <a th:href="@{/admin/clientes}" class="nav-item">
                    <span class="icon"><i class="bi bi-people"></i></span>
                    <span>Clientes</span>
                </a>
                <a th:href="@{/admin/facturas}" class="nav-item">
                    <span class="icon"><i class="bi bi-file-earmark-text"></i></span>
                    <span>Facturas</span>
                </a>
                <a th:href="@{/admin/reportes}" class="nav-item">
                    <span class="icon"><i class="bi bi-bar-chart"></i></span>
                    <span>Reportes</span>
                </a>
            </div>
        </nav>
        <div class="main-content">
            <header class="topbar">
                <div class="page-title">
                    <h4>Dashboard</h4>
                </div>
                <div class="user-info">
                    <span style="font-size:0.9rem;" th:text="'Hola, ' + ${usuario}"></span>
                    <div class="user-avatar" th:text="${#strings.substring(usuario, 0, 1)}"></div>
                    <form method="post" th:action="@{/logout}" class="m-0">
                        <button type="submit" class="btn btn-outline-custom btn-sm-custom">
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </form>
                </div>
            </header>
            <div class="content-area">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <i class="bi bi-box"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${totalProductos}">0</h3>
                            <p>Productos registrados</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <i class="bi bi-cart-check"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${totalPedidos}">0</h3>
                            <p>Pedidos registrados</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange">
                            <i class="bi bi-people"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${totalClientes}">0</h3>
                            <p>Clientes registrados</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red">
                            <i class="bi bi-exclamation-triangle"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${stockBajo}">0</h3>
                            <p>Productos con stock bajo</p>
                        </div>
                    </div>
                </div>

                <h5 class="fw-bold mb-3" style="color:var(--text);">
                    <i class="bi bi-lightning-charge me-2"></i>Acciones Rapidas
                </h5>
                <div class="actions-grid">
                    <a th:href="@{/productos/nuevo}" class="action-card">
                        <div class="icon"><i class="bi bi-box"></i></div>
                        <h6>Nuevo Producto</h6>
                    </a>
                    <a th:href="@{/admin/pedidos}" class="action-card">
                        <div class="icon"><i class="bi bi-cart"></i></div>
                        <h6>Ver Pedidos</h6>
                    </a>
                    <a th:href="@{/admin/clientes}" class="action-card">
                        <div class="icon"><i class="bi bi-people"></i></div>
                        <h6>Ver Clientes</h6>
                    </a>
                    <a th:href="@{/admin/facturas}" class="action-card">
                        <div class="icon"><i class="bi bi-file-earmark-text"></i></div>
                        <h6>Ver Facturas</h6>
                    </a>
                    <a th:href="@{/admin/reportes}" class="action-card">
                        <div class="icon"><i class="bi bi-bar-chart"></i></div>
                        <h6>Reportes</h6>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
