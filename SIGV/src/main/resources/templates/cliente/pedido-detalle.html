<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido # - GesCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css(v=${#dates.createNow().getTime()})}" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="bi bi-shop"></i></div>
                <div>
                    <h5>GesCom</h5>
                    <small>Cliente</small>
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="menu-label">Menu</div>
                <a th:href="@{/cliente/dashboard}" class="nav-item">
                    <span class="icon"><i class="bi bi-grid"></i></span>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/cliente/productos}" class="nav-item">
                    <span class="icon"><i class="bi bi-box-seam"></i></span>
                    <span>Productos</span>
                </a>
                <a th:href="@{/cliente/carrito}" class="nav-item">
                    <span class="icon"><i class="bi bi-cart"></i></span>
                    <span>Carrito</span>
                </a>
                <a th:href="@{/cliente/pedidos}" class="nav-item active">
                    <span class="icon"><i class="bi bi-cart-check"></i></span>
                    <span>Mis Pedidos</span>
                </a>
                <a th:href="@{/cliente/perfil}" class="nav-item">
                    <span class="icon"><i class="bi bi-person"></i></span>
                    <span>Mi Perfil</span>
                </a>
            </div>
        </nav>
        <div class="main-content">
            <header class="topbar">
                <div class="page-title">
                    <h4 th:text="'Pedido #' + ${pedido.idPedido}">Pedido #1</h4>
                </div>
                <div class="user-info">
                    <span style="font-size:0.9rem;" th:text="'Hola, ' + ${usuario}"></span>
                    <div class="user-avatar" th:text="${#strings.substring(usuario, 0, 1)}"></div>
                    <form method="post" th:action="@{/logout}" class="m-0">
                        <button type="submit" class="btn btn-outline-custom btn-sm-custom">
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </form>
                </div>
            </header>
            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <span th:text="'Fecha: ' + ${#dates.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}" style="color:var(--text-dim);"></span>
                    </div>
                    <div>
                        <span th:if="${pedido.estado == 'PENDIENTE'}" class="badge" style="background:rgba(245,158,11,0.1);color:#F59E0B;padding:0.5rem 1rem;font-weight:500;border-radius:8px;" th:text="${pedido.estado}">PENDIENTE</span>
                        <span th:if="${pedido.estado == 'CONFIRMADO'}" class="badge" style="background:rgba(59,130,246,0.1);color:#3B82F6;padding:0.5rem 1rem;font-weight:500;border-radius:8px;" th:text="${pedido.estado}">CONFIRMADO</span>
                        <span th:if="${pedido.estado == 'ENVIADO'}" class="badge" style="background:rgba(139,92,246,0.1);color:#8B5CF6;padding:0.5rem 1rem;font-weight:500;border-radius:8px;" th:text="${pedido.estado}">ENVIADO</span>
                        <span th:if="${pedido.estado == 'ENTREGADO'}" class="badge" style="background:rgba(34,197,94,0.1);color:#22C55E;padding:0.5rem 1rem;font-weight:500;border-radius:8px;" th:text="${pedido.estado}">ENTREGADO</span>
                        <span th:if="${pedido.estado == 'CANCELADO'}" class="badge" style="background:rgba(239,68,68,0.1);color:#EF4444;padding:0.5rem 1rem;font-weight:500;border-radius:8px;" th:text="${pedido.estado}">CANCELADO</span>
                    </div>
                </div>
                <div class="table-container">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Producto</th>
                                <th>Precio Unit.</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="d : ${pedido.detalle}">
                                <td><strong th:text="${d.producto.nombre}">Producto</strong></td>
                                <td th:text="'$' + ${d.precioUnitario}">$0.00</td>
                                <td th:text="${d.cantidad}">1</td>
                                <td style="font-weight:600;" th:text="'$' + ${d.subtotal}">$0.00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-end mt-3">
                    <h5 style="color:var(--primary);font-weight:800;" th:text="'Total: $' + ${pedido.total}">$0.00</h5>
                </div>
                <div class="d-flex justify-content-between mt-3">
                    <a th:href="@{/cliente/pedidos}" class="btn btn-outline-custom" style="border-radius:8px;">
                        <i class="bi bi-arrow-left me-1"></i>Volver a Mis Pedidos
                    </a>
                    <a th:href="@{'/cliente/factura/' + ${pedido.idPedido}}" class="btn btn-primary-custom" style="border-radius:8px;">
                        <i class="bi bi-file-earmark-text me-1"></i>Ver Factura
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
