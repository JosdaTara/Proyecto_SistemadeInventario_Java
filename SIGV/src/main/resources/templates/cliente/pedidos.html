<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos - GesCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css(v=${#dates.createNow().getTime()})}" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="bi bi-shop"></i></div>
                <div>
                    <h5>GesCom</h5>
                    <small>Cliente</small>
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="menu-label">Menu</div>
                <a th:href="@{/cliente/dashboard}" class="nav-item">
                    <span class="icon"><i class="bi bi-grid"></i></span>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/cliente/productos}" class="nav-item">
                    <span class="icon"><i class="bi bi-box-seam"></i></span>
                    <span>Productos</span>
                </a>
                <a class="nav-item active">
                    <span class="icon"><i class="bi bi-cart-check"></i></span>
                    <span>Mis Pedidos</span>
                </a>
                <a th:href="@{/cliente/perfil}" class="nav-item">
                    <span class="icon"><i class="bi bi-person"></i></span>
                    <span>Mi Perfil</span>
                </a>
            </div>
        </nav>

        <div class="main-content">
            <header class="topbar">
                <div class="page-title">
                    <h4>Mis Pedidos</h4>
                </div>
                <div class="user-info">
                    <span style="font-size:0.9rem;" th:text="'Hola, ' + ${usuario}"></span>
                    <div class="user-avatar" th:text="${#strings.substring(usuario, 0, 1)}"></div>
                    <form method="post" th:action="@{/logout}" class="m-0">
                        <button type="submit" class="btn btn-outline-custom btn-sm-custom">
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </form>
                </div>
            </header>

            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0" style="color:var(--text);">
                        <i class="bi bi-clock-history me-2"></i>Historial de Pedidos
                    </h5>
                </div>

                <div class="table-container">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Pedido #</th>
                                <th>Fecha</th>
                                <th>Productos</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="6" class="text-center py-4" style="color:var(--text-dim);">
                                    <i class="bi bi-inbox" style="font-size:1.5rem;display:block;margin-bottom:0.5rem;"></i>
                                    No has realizado pedidos aun.
                                    <br>
                                    <a th:href="@{/cliente/productos}" style="color:var(--primary);text-decoration:none;font-weight:600;">
                                        <i class="bi bi-arrow-right me-1"></i>Ver catalogo de productos
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
