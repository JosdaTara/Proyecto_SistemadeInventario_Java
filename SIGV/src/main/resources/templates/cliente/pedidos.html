<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos - GesCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css(v=${#dates.createNow().getTime()})}" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="bi bi-shop"></i></div>
                <div>
                    <h5>GesCom</h5>
                    <small>Cliente</small>
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="menu-label">Menu</div>
                <a th:href="@{/cliente/dashboard}" class="nav-item">
                    <span class="icon"><i class="bi bi-grid"></i></span>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/cliente/productos}" class="nav-item">
                    <span class="icon"><i class="bi bi-box-seam"></i></span>
                    <span>Productos</span>
                </a>
                <a th:href="@{/cliente/carrito}" class="nav-item">
                    <span class="icon"><i class="bi bi-cart"></i></span>
                    <span>Carrito</span>
                </a>
                <a class="nav-item active">
                    <span class="icon"><i class="bi bi-cart-check"></i></span>
                    <span>Mis Pedidos</span>
                </a>
                <a th:href="@{/cliente/perfil}" class="nav-item">
                    <span class="icon"><i class="bi bi-person"></i></span>
                    <span>Mi Perfil</span>
                </a>
            </div>
        </nav>
        <div class="main-content">
            <header class="topbar">
                <div class="page-title">
                    <h4>Mis Pedidos</h4>
                </div>
                <div class="user-info">
                    <span style="font-size:0.9rem;" th:text="'Hola, ' + ${usuario}"></span>
                    <div class="user-avatar" th:text="${#strings.substring(usuario, 0, 1)}"></div>
                    <form method="post" th:action="@{/logout}" class="m-0">
                        <button type="submit" class="btn btn-outline-custom btn-sm-custom">
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </form>
                </div>
            </header>
            <div class="content-area">
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="table-container">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th># Pedido</th>
                                <th>Fecha</th>
                                <th>Total (COP)</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${pedidos}">
                                <td style="font-weight:600;" th:text="'#' + ${p.idPedido}">#1</td>
                                <td th:text="${#dates.format(p.fechaPedido, 'dd/MM/yyyy HH:mm')}">01/06/2026</td>
                                <td style="font-weight:600;" th:text="'$' + ${#numbers.formatDecimal(p.total, 0, 'COMMA', 0, 'POINT')}">$0</td>
                                <td>
                                    <span th:if="${p.estado == 'PENDIENTE'}" class="badge" style="background:rgba(245,158,11,0.1);color:#F59E0B;padding:0.35rem 0.75rem;font-weight:500;border-radius:8px;" th:text="${p.estado}">PENDIENTE</span>
                                    <span th:if="${p.estado == 'CONFIRMADO'}" class="badge" style="background:rgba(59,130,246,0.1);color:#3B82F6;padding:0.35rem 0.75rem;font-weight:500;border-radius:8px;" th:text="${p.estado}">CONFIRMADO</span>
                                    <span th:if="${p.estado == 'ENVIADO'}" class="badge" style="background:rgba(139,92,246,0.1);color:#8B5CF6;padding:0.35rem 0.75rem;font-weight:500;border-radius:8px;" th:text="${p.estado}">ENVIADO</span>
                                    <span th:if="${p.estado == 'ENTREGADO'}" class="badge" style="background:rgba(34,197,94,0.1);color:#22C55E;padding:0.35rem 0.75rem;font-weight:500;border-radius:8px;" th:text="${p.estado}">ENTREGADO</span>
                                    <span th:if="${p.estado == 'CANCELADO'}" class="badge" style="background:rgba(239,68,68,0.1);color:#EF4444;padding:0.35rem 0.75rem;font-weight:500;border-radius:8px;" th:text="${p.estado}">CANCELADO</span>
                                </td>
                                <td>
                                    <a th:href="@{'/cliente/pedido/' + ${p.idPedido}}" class="btn btn-sm" style="background:rgba(22,101,52,0.1);color:var(--primary);border:none;border-radius:8px;">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pedidos)}">
                                <td colspan="5" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox" style="font-size:1.5rem;display:block;margin-bottom:0.5rem;"></i>
                                    No has realizado ningun pedido aun
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
