<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - GesCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css(v=${#dates.createNow().getTime()})}" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="bi bi-shop"></i></div>
                <div>
                    <h5>GesCom</h5>
                    <small>Cliente</small>
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="menu-label">Menu</div>
                <a th:href="@{/cliente/dashboard}" class="nav-item">
                    <span class="icon"><i class="bi bi-grid"></i></span>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/cliente/productos}" class="nav-item">
                    <span class="icon"><i class="bi bi-box-seam"></i></span>
                    <span>Productos</span>
                </a>
                <a th:href="@{/cliente/pedidos}" class="nav-item">
                    <span class="icon"><i class="bi bi-cart-check"></i></span>
                    <span>Mis Pedidos</span>
                </a>
                <a class="nav-item active">
                    <span class="icon"><i class="bi bi-person"></i></span>
                    <span>Mi Perfil</span>
                </a>
            </div>
        </nav>

        <div class="main-content">
            <header class="topbar">
                <div class="page-title">
                    <h4>Mi Perfil</h4>
                </div>
                <div class="user-info">
                    <span style="font-size:0.9rem;" th:text="'Hola, ' + ${nombre}"></span>
                    <div class="user-avatar" th:text="${#strings.substring(nombre, 0, 1)}"></div>
                    <form method="post" th:action="@{/logout}" class="m-0">
                        <button type="submit" class="btn btn-outline-custom btn-sm-custom">
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </form>
                </div>
            </header>

            <div class="content-area">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="text-center p-4" style="background:white;border-radius:14px;border:1px solid var(--border);">
                            <div class="user-avatar mx-auto mb-3" style="width:80px;height:80px;font-size:2rem;" th:text="${#strings.substring(nombre, 0, 1)}"></div>
                            <h5 class="fw-bold mb-1" th:text="${nombre}" style="color:var(--text);">Nombre</h5>
                            <p style="color:var(--text-dim);font-size:0.85rem;" th:text="${email}">email</p>
                            <span class="badge" style="background:rgba(22,101,52,0.1);color:var(--primary);font-weight:500;padding:0.5rem 1rem;">
                                <i class="bi bi-person-badge me-1"></i>Cliente
                            </span>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div style="background:white;border-radius:14px;border:1px solid var(--border);padding:1.5rem;">
                            <h5 class="fw-bold mb-4" style="color:var(--text);">
                                <i class="bi bi-person-lines-fill me-2"></i>Informacion Personal
                            </h5>
                            <div class="row mb-3">
                                <div class="col-sm-4" style="color:var(--text-dim);font-weight:500;">Nombre</div>
                                <div class="col-sm-8" style="color:var(--text);font-weight:600;" th:text="${nombre}">Nombre</div>
                            </div>
                            <hr style="border-color:var(--border);">
                            <div class="row mb-3">
                                <div class="col-sm-4" style="color:var(--text-dim);font-weight:500;">Correo</div>
                                <div class="col-sm-8" style="color:var(--text);font-weight:600;" th:text="${email}">email</div>
                            </div>
                            <hr style="border-color:var(--border);">
                            <div class="row mb-3">
                                <div class="col-sm-4" style="color:var(--text-dim);font-weight:500;">Rol</div>
                                <div class="col-sm-8">
                                    <span class="badge" style="background:rgba(22,101,52,0.1);color:var(--primary);font-weight:500;">Cliente</span>
                                </div>
                            </div>
                            <hr style="border-color:var(--border);">
                            <div class="row mb-3">
                                <div class="col-sm-4" style="color:var(--text-dim);font-weight:500;">Miembro desde</div>
                                <div class="col-sm-8" style="color:var(--text);font-weight:600;" th:text="${#dates.format(fechaRegistro, 'dd/MM/yyyy')}">fecha</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
