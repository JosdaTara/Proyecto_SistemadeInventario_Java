<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - GesCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css(v=${#dates.createNow().getTime()})}" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="bi bi-shop"></i></div>
                <div>
                    <h5>GesCom</h5>
                    <small>Cliente</small>
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="menu-label">Menu</div>
                <a th:href="@{/cliente/dashboard}" class="nav-item">
                    <span class="icon"><i class="bi bi-grid"></i></span>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/cliente/productos}" class="nav-item">
                    <span class="icon"><i class="bi bi-box-seam"></i></span>
                    <span>Productos</span>
                </a>
                <a class="nav-item active">
                    <span class="icon"><i class="bi bi-cart"></i></span>
                    <span>Carrito</span>
                </a>
                <a th:href="@{/cliente/pedidos}" class="nav-item">
                    <span class="icon"><i class="bi bi-cart-check"></i></span>
                    <span>Mis Pedidos</span>
                </a>
                <a th:href="@{/cliente/perfil}" class="nav-item">
                    <span class="icon"><i class="bi bi-person"></i></span>
                    <span>Mi Perfil</span>
                </a>
            </div>
        </nav>
        <div class="main-content">
            <header class="topbar">
                <div class="page-title">
                    <h4>Carrito de Compras</h4>
                </div>
                <div class="user-info">
                    <span style="font-size:0.9rem;" th:text="'Hola, ' + ${usuario}"></span>
                    <div class="user-avatar" th:text="${#strings.substring(usuario, 0, 1)}"></div>
                    <form method="post" th:action="@{/logout}" class="m-0">
                        <button type="submit" class="btn btn-outline-custom btn-sm-custom">
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </form>
                </div>
            </header>
            <div class="content-area">
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${#lists.isEmpty(items)}" class="text-center py-5">
                    <i class="bi bi-cart-x" style="font-size:4rem;color:var(--text-dim);display:block;margin-bottom:1rem;"></i>
                    <h5 style="color:var(--text-dim);">Tu carrito esta vacio</h5>
                    <p style="color:var(--text-light);">Agrega productos desde el catalogo</p>
                    <a th:href="@{/cliente/productos}" class="btn btn-primary-custom mt-2">
                        <i class="bi bi-box-seam me-1"></i>Ver Catalogo
                    </a>
                </div>

                <div th:unless="${#lists.isEmpty(items)}">
                    <div class="table-container">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio Unit. (COP)</th>
                                    <th style="width:150px;">Cantidad</th>
                                    <th>Subtotal (COP)</th>
                                    <th style="width:60px;"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${items}">
                                    <td><strong th:text="${item.nombre}">Producto</strong></td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(item.precio, 0, 'COMMA', 0, 'POINT')}">$0</td>
                                    <td>
                                        <form method="post" th:action="@{/cliente/carrito/actualizar}" class="d-flex align-items-center gap-2">
                                            <input type="hidden" name="productoId" th:value="${item.productoId}">
                                            <input type="number" name="cantidad" th:value="${item.cantidad}" min="1" class="form-control" style="width:70px;border-radius:8px;text-align:center;">
                                            <button type="submit" class="btn btn-sm" style="background:rgba(22,101,52,0.1);color:var(--primary);border:none;border-radius:8px;">
                                                <i class="bi bi-arrow-repeat"></i>
                                            </button>
                                        </form>
                                    </td>
                                    <td style="font-weight:600;" th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}">$0</td>
                                    <td>
                                        <form method="post" th:action="@{/cliente/carrito/eliminar}">
                                            <input type="hidden" name="productoId" th:value="${item.productoId}">
                                            <button type="submit" class="btn btn-sm" style="background:rgba(239,68,68,0.1);color:#EF4444;border:none;border-radius:8px;">
                                                <i class="bi bi-x-lg"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 p-4" style="background:white;border-radius:14px;border:1px solid var(--border);">
                        <div>
                            <span style="color:var(--text-dim);">Total a pagar:</span>
                            <span style="font-size:1.8rem;font-weight:800;color:var(--primary);margin-left:0.75rem;" th:text="'$' + ${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')}">$0</span>
                        </div>
                        <div class="d-flex gap-2 align-items-center">
                            <a th:href="@{/cliente/productos}" class="btn btn-outline-custom" style="border-radius:8px;">
                                <i class="bi bi-arrow-left me-1"></i>Seguir Comprando
                            </a>
                            <form method="post" th:action="@{/cliente/checkout}" class="d-flex align-items-center gap-2">
                                <select name="metodoPago" class="form-select" required style="border-radius:8px;width:auto;">
                                    <option value="EFECTIVO">Efectivo</option>
                                    <option value="TARJETA_CREDITO">Tarjeta Credito</option>
                                    <option value="TARJETA_DEBITO">Tarjeta Debito</option>
                                    <option value="TRANSFERENCIA">Transferencia</option>
                                    <option value="NEQUI">Nequi</option>
                                </select>
                                <button type="submit" class="btn btn-primary-custom" style="border-radius:8px;">
                                    <i class="bi bi-check2-circle me-1"></i>Confirmar Pedido
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
