<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - GesCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css(v=${#dates.createNow().getTime()})}" rel="stylesheet">
    <style>
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            background: white;
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s;
        }
        .product-card:hover {
            border-color: rgba(22, 101, 52, 0.3);
            box-shadow: 0 4px 12px rgba(22, 101, 52, 0.06);
            transform: translateY(-2px);
        }
        .product-card .img-placeholder {
            width: 100%;
            height: 160px;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--primary);
        }
        .product-card h5 {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.25rem;
        }
        .product-card .category {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }
        .product-card .price {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.75rem;
        }
        .product-card .description {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="bi bi-shop"></i></div>
                <div>
                    <h5>GesCom</h5>
                    <small>Cliente</small>
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="menu-label">Menu</div>
                <a th:href="@{/cliente/dashboard}" class="nav-item">
                    <span class="icon"><i class="bi bi-grid"></i></span>
                    <span>Dashboard</span>
                </a>
                <a class="nav-item active">
                    <span class="icon"><i class="bi bi-box-seam"></i></span>
                    <span>Productos</span>
                </a>
                <a th:href="@{/cliente/carrito}" class="nav-item">
                    <span class="icon"><i class="bi bi-cart"></i></span>
                    <span>Carrito</span>
                </a>
                <a th:href="@{/cliente/pedidos}" class="nav-item">
                    <span class="icon"><i class="bi bi-cart-check"></i></span>
                    <span>Mis Pedidos</span>
                </a>
                <a th:href="@{/cliente/perfil}" class="nav-item">
                    <span class="icon"><i class="bi bi-person"></i></span>
                    <span>Mi Perfil</span>
                </a>
            </div>
        </nav>

        <div class="main-content">
            <header class="topbar">
                <div class="page-title">
                    <h4>Catalogo de Productos</h4>
                </div>
                <div class="user-info">
                    <span style="font-size:0.9rem;" th:text="'Hola, ' + ${usuario}"></span>
                    <div class="user-avatar" th:text="${#strings.substring(usuario, 0, 1)}"></div>
                    <form method="post" th:action="@{/logout}" class="m-0">
                        <button type="submit" class="btn btn-outline-custom btn-sm-custom">
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </form>
                </div>
            </header>

            <div class="content-area">
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h5 class="fw-bold mb-1" style="color:var(--text);">Todos los Productos</h5>
                        <span style="color:var(--text-dim);font-size:0.9rem;" th:text="${#lists.size(productos)} + ' productos disponibles'"></span>
                    </div>
                    <div class="d-flex gap-2 align-items-center">
                        <a th:href="@{/cliente/carrito}" class="btn btn-outline-custom btn-sm-custom">
                            <i class="bi bi-cart me-1"></i>Ver Carrito
                        </a>
                    </div>
                </div>

                <div class="product-grid">
                    <div class="product-card" th:each="p : ${productos}">
                        <form method="post" th:action="@{/cliente/carrito/agregar}">
                            <input type="hidden" name="productoId" th:value="${p.idProducto}">
                            <input type="hidden" name="cantidad" value="1">
                            <img th:if="${p.imagenUrl != null}" th:src="@{${p.imagenUrl}}" style="width:100%;height:160px;object-fit:cover;border-radius:10px;" alt="">
                            <div th:unless="${p.imagenUrl != null}" class="img-placeholder" style="background:linear-gradient(135deg, #f0fdf4, #dcfce7);">
                                <i class="bi bi-box-seam"></i>
                            </div>
                            <h5 th:text="${p.nombre}">Producto</h5>
                            <div class="category" th:text="${p.categoria}">Categoria</div>
                            <div class="price" th:text="'$' + ${#numbers.formatDecimal(p.precio, 0, 'COMMA', 0, 'POINT')}">$0</div>
                            <div class="description" th:text="${p.descripcion}">Descripcion</div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary-custom btn-sm" th:disabled="${p.stock <= 0}">
                                    <i class="bi bi-cart-plus me-1"></i>
                                    <span th:text="${p.stock > 0} ? 'Agregar al carrito' : 'Agotado'">Agregar</span>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div th:if="${#lists.isEmpty(productos)}" class="text-center py-5" style="grid-column:1/-1;color:var(--text-dim);">
                        <i class="bi bi-inbox" style="font-size:3rem;display:block;margin-bottom:1rem;"></i>
                        No hay productos disponibles aun
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
