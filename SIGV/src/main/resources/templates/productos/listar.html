<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - GesCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css(v=${#dates.createNow().getTime()})}" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="bi bi-box-seam-fill"></i></div>
                <div>
                    <h5>GesCom</h5>
                    <small>Gestion Comercial</small>
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="menu-label">Menu Principal</div>
                <a th:href="@{/dashboard}" class="nav-item">
                    <span class="icon"><i class="bi bi-grid"></i></span>
                    <span>Dashboard</span>
                </a>
                <a class="nav-item active">
                    <span class="icon"><i class="bi bi-box"></i></span>
                    <span>Productos</span>
                </a>
                <a th:href="@{/admin/pedidos}" class="nav-item">
                    <span class="icon"><i class="bi bi-cart"></i></span>
                    <span>Pedidos</span>
                </a>
                <a th:href="@{/admin/clientes}" class="nav-item">
                    <span class="icon"><i class="bi bi-people"></i></span>
                    <span>Clientes</span>
                </a>
                <a th:href="@{/admin/usuarios}" class="nav-item">
                    <span class="icon"><i class="bi bi-person-gear"></i></span>
                    <span>Usuarios</span>
                </a>
                <a th:href="@{/admin/facturas}" class="nav-item">
                    <span class="icon"><i class="bi bi-file-earmark-text"></i></span>
                    <span>Facturas</span>
                </a>
                <a th:href="@{/admin/reportes}" class="nav-item">
                    <span class="icon"><i class="bi bi-bar-chart"></i></span>
                    <span>Reportes</span>
                </a>
            </div>
        </nav>
        <div class="main-content">
            <header class="topbar">
                <div class="page-title">
                    <h4>Gestion de Productos</h4>
                </div>
                <div class="user-info">
                    <span style="font-size:0.9rem;" th:text="'Admin'"></span>
                    <div class="user-avatar">A</div>
                    <form method="post" th:action="@{/logout}" class="m-0">
                        <button type="submit" class="btn btn-outline-custom btn-sm-custom">
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </form>
                </div>
            </header>
            <div class="content-area">
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0" style="color:var(--text);">
                        <i class="bi bi-box me-2"></i>Todos los Productos
                    </h5>
                    <a th:href="@{/productos/nuevo}" class="btn btn-primary-custom">
                        <i class="bi bi-plus-lg me-1"></i>Nuevo Producto
                    </a>
                </div>
                <div class="table-container">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Categoria</th>
                                <th>Precio (COP)</th>
                                <th>Stock</th>
                                <th>Estado</th>
                                <th style="width:120px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${productos}">
                                <td th:text="${p.idProducto}" style="font-weight:600;">1</td>
                                <td><strong th:text="${p.nombre}">Producto</strong></td>
                                <td><span class="badge" style="background:rgba(22,101,52,0.1);color:var(--primary);font-weight:500;" th:text="${p.categoria}">Cat</span></td>
                                <td style="font-weight:600;" th:text="'$' + ${#numbers.formatDecimal(p.precio, 0, 'COMMA', 0, 'POINT')}">$0</td>
                                <td>
                                    <span th:if="${p.stock > 0}" style="color:#22C55E;font-weight:600;" th:text="${p.stock}">10</span>
                                    <span th:unless="${p.stock > 0}" style="color:#EF4444;font-weight:600;">Agotado</span>
                                </td>
                                <td>
                                    <span th:if="${p.activo}" class="badge" style="background:rgba(34,197,94,0.1);color:#22C55E;font-weight:500;">Activo</span>
                                    <span th:unless="${p.activo}" class="badge" style="background:rgba(239,68,68,0.1);color:#EF4444;font-weight:500;">Inactivo</span>
                                </td>
                                <td>
                                    <div class="d-flex gap-1">
                                        <a th:href="@{'/productos/editar/' + ${p.idProducto}}" class="btn btn-sm" style="background:rgba(22,101,52,0.1);color:var(--primary);border:none;border-radius:8px;">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{'/productos/eliminar/' + ${p.idProducto}}" class="btn btn-sm" style="background:rgba(239,68,68,0.1);color:#EF4444;border:none;border-radius:8px;"
                                           onclick="return confirm('Eliminar producto?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(productos)}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox" style="font-size:1.5rem;display:block;margin-bottom:0.5rem;"></i>
                                    No hay productos registrados
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
