<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - GesCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-left">
            <div class="brand">
                <div class="brand-icon">
                    <i class="bi bi-box-seam-fill"></i>
                </div>
                <h1>GesCom</h1>
                <p>Gestion Comercial - Inventario, Ventas y Clientes</p>
            </div>
            <div class="features">
                <div class="feature-item">
                    <div class="icon"><i class="bi bi-shield-check"></i></div>
                    <div>
                        <strong>Registro Seguro</strong>
                        <div style="font-size:0.85rem;color:var(--text-dim);">Tus datos estan protegidos</div>
                    </div>
                </div>
                <div class="feature-item">
                    <div class="icon"><i class="bi bi-people"></i></div>
                    <div>
                        <strong>Roles de Usuario</strong>
                        <div style="font-size:0.85rem;color:var(--text-dim);">Administrador y Cliente</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-card">
                <h2>Crear Cuenta</h2>
                <p class="subtitle">Completa tus datos para registrarte en el sistema</p>

                <div th:if="${param.error}" class="alert alert-danger alert-custom d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${param.error}"></span>
                </div>

                <form method="post" th:action="@{/registro-guardar}">
                    <div class="form-floating mb-3">
                        <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Nombre completo" required>
                        <label for="nombre"><i class="bi bi-person me-2"></i>Nombre Completo</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="email" id="email" name="email" class="form-control" placeholder="correo@empresa.com" required>
                        <label for="email"><i class="bi bi-envelope me-2"></i>Correo Electronico</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Contrasena" required minlength="6">
                        <label for="password"><i class="bi bi-lock me-2"></i>Contrasena (min. 6 caracteres)</label>
                    </div>
                    <div class="form-floating mb-4">
                        <select id="rol" name="rol" class="form-select">
                            <option value="Cliente">Cliente</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                        <label for="rol"><i class="bi bi-person-badge me-2"></i>Tipo de Usuario</label>
                    </div>
                    <button type="submit" class="btn btn-primary-custom btn-primary w-100 mb-3">
                        <i class="bi bi-person-plus me-2"></i>Crear Cuenta
                    </button>
                </form>

                <div class="divider">o</div>

                <p class="text-center mb-0">
                    <a th:href="@{/login}" class="text-decoration-none fw-semibold" style="color:var(--primary);">
                        <i class="bi bi-arrow-left me-1"></i>Ya tengo una cuenta
                    </a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
